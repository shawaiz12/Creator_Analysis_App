services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: creatoranalytics-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    ports:
      - "14333:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  api:
    build: .
    container_name: creatoranalytics-api
    depends_on:
      - sqlserver
    # The API may start before SQL Server is ready; restarting until it is ready is the simple fix.
    restart: on-failure
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__MigrateOnStartup: "true"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=CreatorAnalytics;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      Authentication__Authority: ${AUTH_AUTHORITY:-}
      Authentication__Audience: ${AUTH_AUDIENCE:-}
    ports:
      - "8080:8080"

volumes:
  sqlserver-data: