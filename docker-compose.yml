services:
  postgres:
    image: postgres:15-alpine
    container_name: creatoranalytics-db
    environment:
      POSTGRES_USER: creator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: creatoranalytics
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creator -d creatoranalytics"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: creatoranalytics-api
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__MigrateOnStartup: "true"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=creatoranalytics;Username=creator;Password=${POSTGRES_PASSWORD}"
      Authentication__Authority: ${AUTH_AUTHORITY:-}
      Authentication__Audience: ${AUTH_AUDIENCE:-}
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Ai__Provider: ${AI_PROVIDER:-}
      Ai__Model: ${AI_MODEL:-}
      Ai__ApiKey: ${AI_API_KEY:-}
    ports:
      - "8080:8080"

volumes:
  postgres-data: