name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

        services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: creator
          POSTGRES_PASSWORD: ${{ secrets.CI_SQL_PASSWORD }}
          POSTGRES_DB: creatoranalytics_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creator -d creatoranalytics_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:

        run: |
          for i in $(seq 1 40); do
            if (echo > /dev/tcp/127.0.0.1/1433) 2>/dev/null; then break; fi
            sleep 3
          done
          sleep 20

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=creatoranalytics_ci;Username=creator;Password=${{ secrets.CI_SQL_PASSWORD }}" }};TrustServerCertificate=True"
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build --tag creatoranalytics-api .